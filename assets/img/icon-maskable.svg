<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="时光不语的博客（maskable）">
  <!--
    Android 自适应图标（maskable）用的源文件：
    - 背景必须"满版"（没有圆角、没有透明），系统会自己套圆形/方圆/水滴等遮罩；
    - 字形要留在中心直径 80% 的"安全区"内，否则被裁掉。
    导出：icon-maskable-512.png（512×512，不透明）。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0513f"/>
      <stop offset="48%" stop-color="#b4453a"/>
      <stop offset="100%" stop-color="#8e352c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="Microsoft YaHei, PingFang SC, Songti SC, Segoe UI, system-ui, sans-serif"
        font-size="250" font-weight="700" fill="#fffdfa">时</text>
</svg>
